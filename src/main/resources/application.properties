spring.application.name=internship-tracker
spring.config.import=optional:file:./.secrets/application.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/internship_tracker
spring.datasource.username=devinfischer
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.demo.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
